<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Typing Animation</title>

    <style>
        @import url('https://fonts.googleapis.com/css?family=Montserrat:100,100i,200,200i,300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i&display=swap&subset=cyrillic');
        
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Orbitron', monospace;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            text-align: center;
        }

        .text-container {
            display: inline-block;
            text-align: left;
        }

        .text {
            color: #3d85c6;
            font-size: 14.7px;
            font-weight: 500;
            white-space: nowrap;
            display: inline;
            text-align: left;
            font-family: Montserrat, monospace !important;
            letter-spacing: 1px;
            margin-left: 0.0px;
            -webkit-font-feature-settings: "kern" 1;
            font-feature-settings: "kern" 1;
            opacity: 1;
        }

        .typed-cursor {
            color: #3d85c6;
            font-size: 14px;
            display: inline;
            font-family: Montserrat, monospace !important;
            font-weight: 600;
            opacity: 1;
            animation: blink 1s infinite;
            margin-left: -2px;  /* Приближаем курсор к тексту */
            letter-spacing: 0;  /* Убираем лишний отступ */
        }

        .iam {
            color: #666666;
            font-size: 77.5px;
            font-weight: 400;
            font-family: Montserrat, monospace !important;
            margin-bottom: -32px;
            text-align: left;
            display: block;
            -webkit-font-feature-settings: "kern" 1;
            font-feature-settings: "kern" 1;
        }

        /* Анимация мигания курсора */
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* Анимация выцветания */
        @keyframes fadeOutText {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        .fading {
            animation: fadeOutText 3s ease-out forwards;
        }

        @supports (-webkit-touch-callout: none) {
            .text, .iam {
                -webkit-font-smoothing: subpixel-antialiased;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-container">
            <div class="iam">
                <svg xmlns="http://www.w3.org/2000/svg" width="310.702" height="94" viewBox="0 0 66.067 11.642">
                    <g aria-label="EMIIA.AI" style="line-height:1.25;-inkscape-font-specification:Montserrat" font-weight="400" font-size="107.126" font-family="Orbitron" letter-spacing="0" word-spacing="0" fill="#666666" stroke-width="1.75">
                        <path d="M10.66 0v1.31H1.313v3.848h7.512v1.326H1.314v3.848h9.345v1.31H0V0zM18.566 5.756L23.416 0h1.801v11.642h-1.314V1.488L18.566 7.81l-5.338-6.322v10.154h-1.314V0h1.8zM26.981 11.642V0h1.315v11.642zM30.562 11.642V0h1.314v11.642zM36.106 0h7.787q.812 0 1.38.566.567.566.567 1.374v9.702h-1.314V7.389h-9.053v4.253H34.16V1.94q0-.808.568-1.374Q35.295 0 36.106 0zm-.633 6.08h9.053V1.94q0-.258-.194-.436-.179-.194-.439-.194h-7.787q-.26 0-.454.194-.179.178-.179.436zM48.987 10.316v1.326h-1.33v-1.326zM53.154 0h7.787q.812 0 1.38.566.567.566.567 1.374v9.702h-1.314V7.389h-9.053v4.253h-1.314V1.94q0-.808.568-1.374Q52.343 0 53.154 0zm-.633 6.08h9.053V1.94q0-.258-.195-.436-.178-.194-.438-.194h-7.787q-.26 0-.454.194-.179.178-.179.436zM64.753 11.642V0h1.314v11.642z" style="-inkscape-font-specification:Orbitron"/>
                    </g>
                </svg>
            </div>
            <span class="text"></span><span class="typed-cursor">_</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var textElement = document.querySelector('.text');
            var cursorElement = document.querySelector('.typed-cursor');
            var fullText = "ПРОСТРАНСТВЕННЫЙ ИНТЕЛЛЕКТ";
            var currentIndex = 0;
            
            function startCycle() {
                // Сброс состояний
                textElement.textContent = '';
                textElement.style.opacity = '1';
                textElement.classList.remove('fading');
                cursorElement.style.opacity = '1';
                cursorElement.classList.remove('fading');
                cursorElement.style.animation = 'blink 1s infinite';
                currentIndex = 0;
                
                // Курсор мигает 3.5 секунды перед набором
                setTimeout(function() {
                    typeChar();
                }, 3500);
            }
            
            function typeChar() {
                if (currentIndex <= fullText.length) {
                    textElement.textContent = fullText.substring(0, currentIndex);
                    currentIndex++;
                    setTimeout(typeChar, 30);
                } else {
                    // Текст набран, курсор продолжает мигать 3.5 секунды
                    setTimeout(fadeOut, 3500);
                }
            }
            
            function fadeOut() {
                // Запускаем анимацию выцветания текста
                textElement.classList.add('fading');
                
                // Курсор тоже выцветает
                cursorElement.style.animation = 'fadeOutText 3s ease-out forwards';
                
                // Ждем 3 секунды (время выцветания) + 2 секунды паузы
                setTimeout(function() {
                    // Восстанавливаем мигание курсора
                    cursorElement.style.animation = 'blink 1s infinite';
                    startCycle();
                }, 5000);
            }
            
            // Запуск первого цикла
            startCycle();
        });
    </script>
</body>
</html>
